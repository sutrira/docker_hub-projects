name: Build, Scan & Publish Multi-Arch Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'openjdk/**'
      - 'openjdk-jre/**'
      - '.dockerenv'
      - '.github/workflows/docker-build-publish.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'openjdk/**'
      - 'openjdk-jre/**'
      - '.dockerenv'
      - '.github/workflows/docker-build-publish.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Select target to build (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - openjdk-all
          - openjdk-jre-all
          - openjdk-21
          - openjdk-25
          - openjdk-jre-21
          - openjdk-jre-25
      push:
        description: 'Publish images to Docker Hub (disabled for dry runs)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Detect Changed Directories & Targets
  # Computes matrix of targets to build based on file diffs or manual dispatch.
  # ----------------------------------------------------------------------------
  detect-changes:
    name: Detect Changed Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Path Filter for Image Directories
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            openjdk_21:
              - 'openjdk/21/**'
            openjdk_25:
              - 'openjdk/25/**'
            openjdk_jre_21:
              - 'openjdk-jre/21/**'
            openjdk_jre_25:
              - 'openjdk-jre/25/**'
            openjdk_docs:
              - 'openjdk/README.md'
            openjdk_jre_docs:
              - 'openjdk-jre/README.md'
            global:
              - '.dockerenv'
              - '.github/workflows/docker-build-publish.yml'

      - name: Compute Build Matrix
        id: set-matrix
        run: |
          EVENT="${{ github.event_name }}"
          DISPATCH_TARGET="${{ github.event.inputs.target }}"
          GLOBAL_CHANGED="${{ steps.filter.outputs.global }}"

          # Source version info from .dockerenv if available
          if [ -f .dockerenv ]; then
            set -a
            # shellcheck disable=SC1091
            source .dockerenv
            set +a
          fi

          V21="${JAVA21_VERSION:-21.0.12_p8-r0}"
          V25="${JAVA25_VERSION:-25.0.4_p7-r0}"

          TARGET_OPENJDK_21="{\"id\":\"openjdk-21\",\"repo\":\"openjdk\",\"type\":\"jdk\",\"version\":\"21\",\"pkg_version\":\"$V21\",\"dir\":\"openjdk/21\",\"is_latest\":false}"
          TARGET_OPENJDK_25="{\"id\":\"openjdk-25\",\"repo\":\"openjdk\",\"type\":\"jdk\",\"version\":\"25\",\"pkg_version\":\"$V25\",\"dir\":\"openjdk/25\",\"is_latest\":true}"
          TARGET_OPENJDK_JRE_21="{\"id\":\"openjdk-jre-21\",\"repo\":\"openjdk-jre\",\"type\":\"jre\",\"version\":\"21\",\"pkg_version\":\"$V21\",\"dir\":\"openjdk-jre/21\",\"is_latest\":false}"
          TARGET_OPENJDK_JRE_25="{\"id\":\"openjdk-jre-25\",\"repo\":\"openjdk-jre\",\"type\":\"jre\",\"version\":\"25\",\"pkg_version\":\"$V25\",\"dir\":\"openjdk-jre/25\",\"is_latest\":true}"

          SELECTED=()

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$DISPATCH_TARGET" in
              all)
                SELECTED+=("$TARGET_OPENJDK_21" "$TARGET_OPENJDK_25" "$TARGET_OPENJDK_JRE_21" "$TARGET_OPENJDK_JRE_25")
                ;;
              openjdk-all)
                SELECTED+=("$TARGET_OPENJDK_21" "$TARGET_OPENJDK_25")
                ;;
              openjdk-jre-all)
                SELECTED+=("$TARGET_OPENJDK_JRE_21" "$TARGET_OPENJDK_JRE_25")
                ;;
              openjdk-21)
                SELECTED+=("$TARGET_OPENJDK_21")
                ;;
              openjdk-25)
                SELECTED+=("$TARGET_OPENJDK_25")
                ;;
              openjdk-jre-21)
                SELECTED+=("$TARGET_OPENJDK_JRE_21")
                ;;
              openjdk-jre-25)
                SELECTED+=("$TARGET_OPENJDK_JRE_25")
                ;;
            esac
          elif [ "$GLOBAL_CHANGED" = "true" ]; then
            echo "Global configuration or workflow modified. Triggering all targets."
            SELECTED+=("$TARGET_OPENJDK_21" "$TARGET_OPENJDK_25" "$TARGET_OPENJDK_JRE_21" "$TARGET_OPENJDK_JRE_25")
          else
            if [ "${{ steps.filter.outputs.openjdk_21 }}" = "true" ]; then
              SELECTED+=("$TARGET_OPENJDK_21")
            fi
            if [ "${{ steps.filter.outputs.openjdk_25 }}" = "true" ] || [ "${{ steps.filter.outputs.openjdk_docs }}" = "true" ]; then
              SELECTED+=("$TARGET_OPENJDK_25")
            fi
            if [ "${{ steps.filter.outputs.openjdk_jre_21 }}" = "true" ]; then
              SELECTED+=("$TARGET_OPENJDK_JRE_21")
            fi
            if [ "${{ steps.filter.outputs.openjdk_jre_25 }}" = "true" ] || [ "${{ steps.filter.outputs.openjdk_jre_docs }}" = "true" ]; then
              SELECTED+=("$TARGET_OPENJDK_JRE_25")
            fi
          fi

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "No target changes detected."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            JSON_ARRAY=$(printf '%s\n' "${SELECTED[@]}" | jq -s -c .)
            echo "Selected matrix targets: $JSON_ARRAY"
            echo "matrix=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------------
  # Job 2: Build, Scan & Publish
  # Executes across the detected matrix of [repo x version] targets
  # ----------------------------------------------------------------------------
  build-scan-publish:
    name: Build & Publish (${{ matrix.id }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    env:
      DOCKERHUB_NAMESPACE: 'sutrira'
      DEFAULT_PLATFORMS: 'linux/amd64,linux/arm64'
      TRIVY_SEVERITY: 'HIGH,CRITICAL'
      TRIVY_IGNORE_UNFIXED: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load .dockerenv configuration
        run: |
          if [ -f .dockerenv ]; then
            echo "Loading configuration from .dockerenv"
            grep -E '^[A-Za-z0-9_]+=' .dockerenv >> "$GITHUB_ENV"
          else
            echo "::warning ::.dockerenv file not found, using defaults"
          fi

      - name: Resolve Image Metadata and Tags
        id: meta
        run: |
          NAMESPACE="${DOCKERHUB_NAMESPACE:-sutrira}"
          REPO="${NAMESPACE}/${{ matrix.repo }}"
          VERSION="${{ matrix.version }}"
          PKG_VERSION="${{ matrix.pkg_version }}"

          # Clean tags only - no -alpine suffix as all images are 100% Alpine based
          TAGS="${REPO}:${VERSION},${REPO}:${PKG_VERSION}"

          if [ "${{ matrix.is_latest }}" = "true" ]; then
            TAGS="${TAGS},${REPO}:latest"
          fi

          # Determine whether to push
          SHOULD_PUSH="false"
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.push }}" = "true" ]; then
              SHOULD_PUSH="true"
            fi
          fi

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "base_image=${BASE_IMAGE:-alpine:3.24.1}" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "should_push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"
          echo "platforms=${DEFAULT_PLATFORMS:-linux/amd64,linux/arm64}" >> "$GITHUB_OUTPUT"
          echo "severity=${TRIVY_SEVERITY:-HIGH,CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "ignore_unfixed=${TRIVY_IGNORE_UNFIXED:-true}" >> "$GITHUB_OUTPUT"

          echo "Repository:   $REPO"
          echo "Target ID:    ${{ matrix.id }}"
          echo "Base Image:   ${BASE_IMAGE:-alpine:3.24.1}"
          echo "Tags:         $TAGS"
          echo "Platforms:    ${DEFAULT_PLATFORMS:-linux/amd64,linux/arm64}"
          echo "Should Push:  $SHOULD_PUSH"

      - name: Set up QEMU (Multi-Architecture)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate with Docker Hub
        if: steps.meta.outputs.should_push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step A: Build and load local single-arch image for vulnerability scanning
      - name: Build local image for vulnerability scan
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.dir }}
          file: ./${{ matrix.dir }}/Dockerfile
          load: true
          tags: local/${{ matrix.id }}:scan
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
            OPENJDK_VERSION=${{ matrix.pkg_version }}
          cache-from: type=gha

      # Step B: Run Trivy Vulnerability Scanner
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.id }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ steps.meta.outputs.severity }}
          ignore-unfixed: ${{ steps.meta.outputs.ignore_unfixed }}

      # Step C: Upload Trivy scan results to GitHub Code Scanning
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # Step D: Multi-Architecture Build & Push
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.dir }}
          file: ./${{ matrix.dir }}/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
            OPENJDK_VERSION=${{ matrix.pkg_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step E: Synchronize README.md to Docker Hub Description
      - name: Sync README to Docker Hub Description
        if: steps.meta.outputs.should_push == 'true' && steps.meta.outputs.repo != ''
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.meta.outputs.repo }}
          readme-filepath: ./${{ matrix.repo }}/README.md
          short-description: "Lightweight, multi-architecture ${{ matrix.repo }} on Alpine Linux 3.24.1"
          enable-url-completion: true
